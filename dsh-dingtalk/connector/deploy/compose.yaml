# Standalone server-side DWS Connector deployment template (Issue #24).
# Stage 1 (build/pin) and Stage 2 (start Connector) are covered here.
# Stage 3 (robot message reception) lives in gateway.compose.yaml and is NOT started by default,
# so no real DingTalk Stream connection is created by `docker compose up`.
#
# Prerequisite: a pinned image built from connector/docker/Dockerfile, referenced by digest, e.g.
#   CONNECTOR_IMAGE=registry.example/dsh-dingtalk-connector@sha256:<digest>
services:
  connector:
    image: ${CONNECTOR_IMAGE:?pin the connector image by digest}
    restart: unless-stopped
    read_only: true
    user: '10001:10001'
    env_file:
      - ./connector.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - connector-state:/var/lib/dsh-dingtalk-connector
      # Per-caller business sockets are bind-mounted individually into caller containers.
      # Mount the same host directory read-only here only for inspection by the operator.
      # - /srv/dsh-dingtalk-connector/sockets:/var/lib/dsh-dingtalk-connector/sockets:ro
    healthcheck:
      test: ['CMD', 'node', '/app/lib/main.mjs', 'health']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # TLS terminator sharing the Connector network namespace, so the Connector OAuth listener can
  # stay bound to 127.0.0.1 while the browser still reaches https://<public-origin>.
  # Supply certificates out of band (never commit them).
  oauth-tls:
    image: ${OAUTH_PROXY_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    network_mode: 'service:connector'
    depends_on:
      connector:
        condition: service_healthy
    volumes:
      - ./nginx-oauth.conf:/etc/nginx/conf.d/default.conf:ro
      - ${OAUTH_TLS_DIR:?mount a directory with fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
    ports:
      - '${OAUTH_PUBLIC_PORT:-443}:8443'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  connector-state:
    # Private volume: DWS tokens, per-user HOME/DWS_CONFIG_DIR/keychain and the admin token.
    # Never mount this into the DSH agent container or the viewer.
